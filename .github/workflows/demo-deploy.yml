name: Demo Deploy Pipeline
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build application
        run: |
          echo "Building application..." | tee -a build.log
          echo "Build completed successfully." | tee -a build.log

      - name: Deploy application
        id: deploy_step
        continue-on-error: true
        run: |
          {
            echo "Process exited with code 1."
            echo "No further details available."
            exit 1
          } 2>&1 | tee -a deploy_failure.log
          exit 1

      - name: Diagnose failure with Deploy Doctor
        if: steps.deploy_step.outcome == 'failure'
        run: |
          LOG_CONTENT=$(cat deploy_failure.log | sed ':a;N;$!ba;s/\n/\\n/g' | sed 's/"/\\"/g')

          START_TIME=$(date +%s)

          RESPONSE=$(curl -s -X POST "${{ vars.DEPLOY_DOCTOR_API_URL }}/diagnose" \
            -H "Content-Type: application/json" \
            -d "{\"log_content\": \"$LOG_CONTENT\"}")

          END_TIME=$(date +%s)
          ELAPSED=$((END_TIME - START_TIME))

          echo "$RESPONSE" > diagnosis_response.json

          echo "## 🩺 Deploy Doctor Diagnosis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⏱️ **Diagnosed in ${ELAPSED} seconds** — manual investigation for this type of failure typically takes 10-15 minutes." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          CATEGORY=$(echo "$RESPONSE" | python3 -c "import sys, json; print(json.load(sys.stdin).get('category', 'unknown'))")
          ROOT_CAUSE=$(echo "$RESPONSE" | python3 -c "import sys, json; print(json.load(sys.stdin).get('root_cause', 'N/A'))")
          EVIDENCE=$(echo "$RESPONSE" | python3 -c "import sys, json; print(json.load(sys.stdin).get('evidence', 'N/A'))")
          FIX=$(echo "$RESPONSE" | python3 -c "import sys, json; print(json.load(sys.stdin).get('suggested_fix', 'N/A'))")
          CONFIDENCE=$(echo "$RESPONSE" | python3 -c "import sys, json; print(json.load(sys.stdin).get('confidence', 'unknown'))")

          {
            echo "**Category:** \`$CATEGORY\`"
            echo ""
            echo "**Confidence:** \`$CONFIDENCE\`"
            echo ""
            echo "### Root Cause"
            echo "$ROOT_CAUSE"
            echo ""
            echo "### Evidence"
            echo "\`\`\`"
            echo "$EVIDENCE"
            echo "\`\`\`"
            echo ""
            echo "### Suggested Fix"
            echo "$FIX"
          } >> $GITHUB_STEP_SUMMARY

          echo "Diagnosis complete - see workflow summary."

      - name: Auto-fix PR, or escalate to an Issue, based on confidence
        if: steps.deploy_step.outcome == 'failure'
        run: |
          AUTO_FIX=$(python3 -c "import json; d = json.load(open('diagnosis_response.json')); print(json.dumps(d.get('auto_fix')))")
          CATEGORY=$(python3 -c "import json; print(json.load(open('diagnosis_response.json')).get('category', 'unknown'))")
          ROOT_CAUSE=$(python3 -c "import json; print(json.load(open('diagnosis_response.json')).get('root_cause', 'N/A'))")
          SUGGESTED_FIX=$(python3 -c "import json; print(json.load(open('diagnosis_response.json')).get('suggested_fix', 'N/A'))")
          CONFIDENCE=$(python3 -c "import json; print(json.load(open('diagnosis_response.json')).get('confidence', 'unknown'))")

          if [ "$AUTO_FIX" == "null" ] || [ -z "$AUTO_FIX" ]; then
            echo "Not auto-fixable (confidence: $CONFIDENCE) - opening a GitHub Issue for human review instead."

            gh issue create \
              --title "🩺 Deploy Doctor: ${CATEGORY} failure needs review (confidence: ${CONFIDENCE})" \
              --body "**Automatically generated by Deploy Doctor**

          This deployment failure was diagnosed automatically, but did not meet
          the bar for an automatic fix (either confidence wasn't high, or the
          fix isn't a safe single-variable change Deploy Doctor can apply on
          its own).

          **Category:** \`${CATEGORY}\`
          **Confidence:** \`${CONFIDENCE}\`

          ### Root Cause
          ${ROOT_CAUSE}

          ### Suggested Fix
          ${SUGGESTED_FIX}

          This requires human judgment - Deploy Doctor intentionally does not
          guess at fixes it isn't confident are safe to apply automatically." \
              --label "deploy-doctor"
            exit 0
          fi

          ENV_VAR_NAME=$(echo "$AUTO_FIX" | python3 -c "import sys, json; print(json.load(sys.stdin)['env_var_name'])")
          VALUE=$(echo "$AUTO_FIX" | python3 -c "import sys, json; print(json.load(sys.stdin)['value'])")
          ACTION=$(echo "$AUTO_FIX" | python3 -c "import sys, json; print(json.load(sys.stdin)['action'])")

          echo "Auto-fixable issue detected: $ACTION env var $ENV_VAR_NAME"

          BRANCH_NAME="deploy-doctor/auto-fix-$(date +%s)"
          git config user.name "Deploy Doctor Bot"
          git config user.email "deploy-doctor-bot@users.noreply.github.com"
          git checkout -b "$BRANCH_NAME"

          if [ "$ACTION" == "update" ] && grep -q "^${ENV_VAR_NAME}=" demo-app/.env.example; then
            sed -i.bak "s|^${ENV_VAR_NAME}=.*|${ENV_VAR_NAME}=${VALUE}|" demo-app/.env.example
            rm -f demo-app/.env.example.bak
            ACTION_DESC="updated"
          else
            echo "${ENV_VAR_NAME}=${VALUE}" >> demo-app/.env.example
            ACTION_DESC="added"
          fi

          git add demo-app/.env.example
          git commit -m "Deploy Doctor auto-fix: ${ACTION_DESC} ${ENV_VAR_NAME}

          This fix was generated automatically by Deploy Doctor after detecting
          a high-confidence environment variable issue.

          Please review and confirm the value before merging."

          git push origin "$BRANCH_NAME"

          gh pr create \
            --title "🩺 Deploy Doctor auto-fix: ${ACTION_DESC} ${ENV_VAR_NAME}" \
            --body "**Automatically generated by Deploy Doctor**

          This PR was opened automatically after Deploy Doctor diagnosed a deployment
          failure with high confidence.

          **Environment variable ${ACTION_DESC}:** \`${ENV_VAR_NAME}\`

          ⚠️ The value set (\`${VALUE}\`) may be a placeholder - review it before merging.

          This PR requires human review and will not be auto-merged." \
            --base main \
            --head "$BRANCH_NAME"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Fail the workflow (deployment did not succeed)
        if: steps.deploy_step.outcome == 'failure'
        run: exit 1