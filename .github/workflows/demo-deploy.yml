name: Demo Deploy Pipeline
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build application
        run: |
          echo "Building application..." | tee -a build.log
          echo "Build completed successfully." | tee -a build.log

      - name: Deploy application
        id: deploy_step
        continue-on-error: true
        run: |
          {
            echo "Deploying container: payments-service:v2.3.1"
            echo "Container started"
            echo "> payments-service start"
            echo "> node dist/server.js"
            echo ""
            echo "Error: Neither apiKey nor config.authenticator provided"
            echo "    at new Stripe (/app/node_modules/stripe/cjs/stripe.core.js:88:13)"
            echo "    at Object.<anonymous> (/app/dist/server.js:14:24)"
            echo ""
            echo "Container exited with code 1"
            echo "Deployment failed for service: payments-service"
            exit 1
          } 2>&1 | tee -a deploy_failure.log
          exit 1

      - name: Diagnose failure with Deploy Doctor
        if: steps.deploy_step.outcome == 'failure'
        run: |
          LOG_CONTENT=$(cat deploy_failure.log | sed ':a;N;$!ba;s/\n/\\n/g' | sed 's/"/\\"/g')

          RESPONSE=$(curl -s -X POST "${{ vars.DEPLOY_DOCTOR_API_URL }}/diagnose" \
            -H "Content-Type: application/json" \
            -d "{\"log_content\": \"$LOG_CONTENT\"}")

          echo "$RESPONSE" > diagnosis_response.json

          echo "## 🩺 Deploy Doctor Diagnosis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          CATEGORY=$(echo "$RESPONSE" | python3 -c "import sys, json; print(json.load(sys.stdin).get('category', 'unknown'))")
          ROOT_CAUSE=$(echo "$RESPONSE" | python3 -c "import sys, json; print(json.load(sys.stdin).get('root_cause', 'N/A'))")
          EVIDENCE=$(echo "$RESPONSE" | python3 -c "import sys, json; print(json.load(sys.stdin).get('evidence', 'N/A'))")
          FIX=$(echo "$RESPONSE" | python3 -c "import sys, json; print(json.load(sys.stdin).get('suggested_fix', 'N/A'))")
          CONFIDENCE=$(echo "$RESPONSE" | python3 -c "import sys, json; print(json.load(sys.stdin).get('confidence', 'unknown'))")

          {
            echo "**Category:** \`$CATEGORY\`"
            echo ""
            echo "**Confidence:** \`$CONFIDENCE\`"
            echo ""
            echo "### Root Cause"
            echo "$ROOT_CAUSE"
            echo ""
            echo "### Evidence"
            echo "\`\`\`"
            echo "$EVIDENCE"
            echo "\`\`\`"
            echo ""
            echo "### Suggested Fix"
            echo "$FIX"
          } >> $GITHUB_STEP_SUMMARY

          echo "Diagnosis complete - see workflow summary."

      - name: Auto-fix and open PR if high-confidence env var issue
        if: steps.deploy_step.outcome == 'failure'
        run: |
          AUTO_FIX=$(python3 -c "import json; d = json.load(open('diagnosis_response.json')); print(json.dumps(d.get('auto_fix')))")

          if [ "$AUTO_FIX" == "null" ] || [ -z "$AUTO_FIX" ]; then
            echo "No auto-fixable issue detected (or confidence too low) - skipping PR creation."
            exit 0
          fi

          ENV_VAR_NAME=$(echo "$AUTO_FIX" | python3 -c "import sys, json; print(json.load(sys.stdin)['env_var_name'])")
          PLACEHOLDER_VALUE=$(echo "$AUTO_FIX" | python3 -c "import sys, json; print(json.load(sys.stdin)['placeholder_value'])")

          echo "Auto-fixable issue detected: missing env var $ENV_VAR_NAME"

          BRANCH_NAME="deploy-doctor/auto-fix-$(date +%s)"
          git config user.name "Deploy Doctor Bot"
          git config user.email "deploy-doctor-bot@users.noreply.github.com"
          git checkout -b "$BRANCH_NAME"

          echo "${ENV_VAR_NAME}=${PLACEHOLDER_VALUE}" >> demo-app/.env.example

          git add demo-app/.env.example
          git commit -m "Deploy Doctor auto-fix: add missing ${ENV_VAR_NAME}

          This fix was generated automatically by Deploy Doctor after detecting
          a high-confidence missing environment variable failure.

          Root cause: deployment failed because ${ENV_VAR_NAME} was not set.
          Please review and replace the placeholder value before merging."

          git push origin "$BRANCH_NAME"

          gh pr create \
            --title "🩺 Deploy Doctor auto-fix: add missing ${ENV_VAR_NAME}" \
            --body "**Automatically generated by Deploy Doctor**

          This PR was opened automatically after Deploy Doctor diagnosed a deployment
          failure caused by a missing environment variable, with high confidence.

          **Environment variable added:** \`${ENV_VAR_NAME}\`

          ⚠️ The value added is a placeholder (\`${PLACEHOLDER_VALUE}\`) - replace it
          with the real value before merging.

          This PR requires human review and will not be auto-merged." \
            --base main \
            --head "$BRANCH_NAME"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Fail the workflow (deployment did not succeed)
        if: steps.deploy_step.outcome == 'failure'
        run: exit 1